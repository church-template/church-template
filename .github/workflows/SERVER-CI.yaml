# server/ 테스트 CI — server/** 변경이 있는 PR(develop·main 대상)과 develop push에서 전체 빌드+테스트를 실행한다.
# 시크릿 불필요: 통합테스트는 Testcontainers가 러너 내장 Docker로 실제 Postgres를 띄운다.
# 버전봇 커밋은 "[skip ci]"를 달고 오므로 push 트리거에서 자동 제외된다(GitHub 기본 동작).
name: SERVER-CI

on:
  pull_request:
    branches: ["develop", "main"]
    paths: ["server/**"]
  push:
    branches: ["develop"]
    paths: ["server/**"]

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # 이후 스텝에 토큰 잔류 방지(빌드는 push 불필요)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: ./gradlew build
